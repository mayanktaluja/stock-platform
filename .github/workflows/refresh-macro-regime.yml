name: Refresh macro regime (backup)

# Backup path for data/macroRegime.json refresh. Fires daily on
# GitHub-hosted runners — independent of the user's Mac being online or
# the main worktree being clean. The primary refresh path is the local
# launchd job com.starbhai.macro-only (every 2h); this workflow exists so
# the staleness banner can't get stuck if the Mac is offline.
#
# Free on public repos: GitHub Actions has unlimited minutes on public
# repositories. No paid services involved. No secrets required.
#
# Why heuristic-only mode: shipping LLM API keys as GH secrets adds
# secret-management surface for a backup path that's intentionally a
# graceful-degradation fallback. The script's keyword heuristic produces
# a lower-fidelity regime classification, but it's deterministic and
# always succeeds when RSS sources are reachable. The local cron remains
# the primary, high-fidelity LLM path.
#
# Race vs. the local cron: the script's material-change/12h ship gate (see
# scripts/refresh-macro-only.sh) is mirrored here so backup refreshes do not
# trigger full Vercel deploys for equivalent macro JSON churn.

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-macro-regime
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh macro regime (heuristic)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # NO `token:` override here — deliberately. The default GITHUB_TOKEN
          # already carries contents: write (see the permissions: block above),
          # which is everything the clone + branch-push path needs.
          #
          # Do NOT reintroduce a `token: ${{ secrets.SOME_PAT || secrets.GITHUB_TOKEN }}`
          # override. A GitHub expression `||` yields the first TRUTHY operand,
          # and an EXPIRED PAT is still a non-empty string — so it short-circuits
          # the fallback and hard-fails checkout with:
          #   fatal: could not read Username for 'https://github.com': terminal prompts disabled
          # The `||` only degrades gracefully when the secret is ABSENT; when it
          # is present-but-stale it takes the whole workflow down at step 1.
          # That is exactly what happened: MACRO_REFRESH_PAT was minted
          # 2026-05-20 with the default 30-day expiry, and every scheduled run
          # from 2026-06-20 through 2026-07-30 (40 consecutive) died in this
          # step. Nothing alerted, because the primary local launchd path
          # (com.starbhai.macro-only) kept shipping and masked the outage.
          #
          # The PAT is now consulted ONLY for the PR/auto-merge step below,
          # where it is probed first and degrades to GITHUB_TOKEN on rejection.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Run macro refresh (heuristic-only)
        env:
          MACRO_ALLOW_HEURISTIC_ONLY: '1'
        run: node scripts/refresh-macro-regime.mjs

      - name: Ship gate (skip equivalent macro snapshot under 12h)
        id: gate
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain data/macroRegime.json)" ]; then
            echo "no_change=1" >> "$GITHUB_OUTPUT"
            echo "no change in data/macroRegime.json"
            exit 0
          fi
          git fetch origin main --quiet || true
          last_ts=$(git log -1 --format=%ct origin/main -- data/macroRegime.json 2>/dev/null || echo 0)
          now_ts=$(date +%s)
          age_min=$(( (now_ts - last_ts) / 60 ))
          gen_age_min=$(node --input-type=module -e '
            import {readFileSync} from "fs";
            try {
              const r = JSON.parse(readFileSync("data/macroRegime.json","utf-8"));
              const gen = new Date(r.generatedAt).getTime();
              process.stdout.write(String(Math.round((Date.now()-gen)/60000)));
            } catch { process.stdout.write("999999"); }
          ' 2>/dev/null || echo 999999)
          decision=$(LAST_COMMIT_AGE_MIN="$age_min" node --input-type=module - <<'NODE'
          import {readFileSync} from "fs";
          import {spawnSync} from "node:child_process";
          const lastAge = Number(process.env.LAST_COMMIT_AGE_MIN || 999999);
          let prev = null;
          let next = null;
          try {
            const child = spawnSync("git", ["show", "origin/main:data/macroRegime.json"], { encoding: "utf-8" });
            if (child.status === 0 && child.stdout) prev = JSON.parse(child.stdout);
          } catch {}
          try { next = JSON.parse(readFileSync("data/macroRegime.json", "utf-8")); } catch {}
          const prevKey = `${prev?.regime || ""}|${prev?.severity ?? ""}`;
          const nextKey = `${next?.regime || ""}|${next?.severity ?? ""}`;
          if (!prev || !next) process.stdout.write("ship:missing_compare");
          else if (prevKey !== nextKey) process.stdout.write("ship:material_change");
          else if (lastAge >= 720) process.stdout.write("ship:age_12h");
          else process.stdout.write(`skip:equivalent_${lastAge}m`);
          NODE
          )
          if [[ "$decision" == skip:* ]]; then
            echo "no_change=1" >> "$GITHUB_OUTPUT"
            echo "ship gate skip: ${decision}, last commit ${age_min}m ago, generatedAt ${gen_age_min}m old"
            exit 0
          fi
          echo "no_change=0" >> "$GITHUB_OUTPUT"
          echo "will commit: ${decision}, last commit ${age_min}m ago, generatedAt ${gen_age_min}m old"

      - name: Probe MACRO_REFRESH_PAT (degrade, never hard-fail, on expiry)
        id: pat
        # Deliberately UNCONDITIONAL — it does not share the ship gate's `if:`.
        # An expired PAT must be visible on every run, including runs where the
        # gate skips because the macro snapshot is equivalent. Gating this on
        # "we had something to ship" is how a dead credential stays invisible.
        env:
          # Passed via env, never interpolated into the script body.
          MACRO_REFRESH_PAT: ${{ secrets.MACRO_REFRESH_PAT }}
        run: |
          # A PAT is a rotating credential; this workflow is a backup path that
          # must survive its expiry. Probe it against the one endpoint we
          # actually need (repo metadata) and record the verdict, so the step
          # below can pick a working token instead of trusting `||`.
          set -uo pipefail
          if [ -z "${MACRO_REFRESH_PAT:-}" ]; then
            echo "pat_ok=0" >> "$GITHUB_OUTPUT"
            echo "::notice::MACRO_REFRESH_PAT is not set. Using GITHUB_TOKEN: the refresh still opens a PR, but that PR will not trigger CI, so it cannot auto-merge unattended."
            exit 0
          fi
          if GH_TOKEN="${MACRO_REFRESH_PAT:-}" gh api "repos/${GITHUB_REPOSITORY}" --silent 2>/dev/null; then
            echo "pat_ok=1" >> "$GITHUB_OUTPUT"
            echo "MACRO_REFRESH_PAT accepted — PR will trigger CI and can auto-merge."
          else
            echo "pat_ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::MACRO_REFRESH_PAT is set but was REJECTED by the GitHub API (expired or revoked). Falling back to GITHUB_TOKEN. The macro refresh will still run and open a PR, but that PR will not trigger \"Smoke + unit tests\", so it cannot auto-merge — it needs a manual merge until the secret is rotated."
          fi

      - name: Open / update backup PR (never push protected main directly)
        if: steps.gate.outputs.no_change == '0'
        env:
          # Prefer the PAT only when the probe above proved it still works, so
          # the PR triggers CI and can auto-merge. Otherwise GITHUB_TOKEN, whose
          # PRs do NOT trigger CI (GitHub blocks workflow-on-workflow recursion)
          # but which at least lands the branch + PR for a manual merge.
          GH_TOKEN: ${{ steps.pat.outputs.pat_ok == '1' && secrets.MACRO_REFRESH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # main is a protected branch (required check "Smoke + unit tests"),
          # so a direct push is rejected with GH006. Route the refresh through
          # a PR instead. A backup path must never turn a transient error into
          # a red scheduled run, so every step below is non-fatal (no `set -e`).
          set -uo pipefail
          BRANCH="automation/macro-backup"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          regime=$(node --input-type=module -e '
            import {readFileSync} from "fs";
            try {
              const r = JSON.parse(readFileSync("data/macroRegime.json","utf-8"));
              process.stdout.write(`${r.regimeLabel || r.regime} (sev ${r.severity}, ${r.classifierProvider})`);
            } catch { process.stdout.write("classifier output"); }
          ' 2>/dev/null)
          # Single reusable branch so backup PRs can never pile up.
          git checkout -B "$BRANCH"
          git add data/macroRegime.json
          # Stage history + headline-archive side effects too, so the next
          # local cron run sees consistent state and doesn't re-archive.
          git add data/macro-headlines/ 2>/dev/null || true
          git add data/macroRegime-history/ 2>/dev/null || true
          msg=$(printf 'chore(macro): GH Actions backup refresh — %s\n\nHeuristic-classified macro regime via the free GH Actions backup\nworkflow (daily, github-hosted runners). Defence-in-depth against\nthe local cron being unavailable. Lower fidelity than the local LLM\npath; the next local cron fire supersedes this with a Groq or\nGemini-classified regime.\n' "$regime")
          git commit -m "$msg" || { echo "nothing to commit"; exit 0; }
          # Push the branch (never main). Automation-exclusive branch, so force
          # is safe; concurrency.group serialises runs.
          if ! git push --force origin "$BRANCH"; then
            echo "::warning::could not push $BRANCH; will retry next run"
            exit 0
          fi
          # Reuse an open PR if one exists, else open one.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null)" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(macro): GH Actions backup refresh — $regime" \
              --body "Automated heuristic macro-regime refresh from the backup workflow (daily fallback when the local cron is unavailable). Auto-merges once \"Smoke + unit tests\" passes; supersede freely with a local-cron refresh." \
              || { echo "::warning::pr create failed; leaving branch for next run"; exit 0; }
          fi
          # Best-effort auto-merge once the required check passes.
          # CAVEAT: on GITHUB_TOKEN the PR will NOT trigger CI, so the required
          # check "Smoke + unit tests" never reports and this PR waits for a
          # manual merge. To restore unattended shipping, ROTATE the
          # MACRO_REFRESH_PAT secret (fine-grained: contents + pull-requests
          # write on this repo) — the probe step above reports in the run log
          # whether the current value is still accepted. Prefer the maximum
          # expiry available; a 30-day PAT silently un-armed this backup path
          # for 41 days once already.
          gh pr merge --squash --auto "$BRANCH" \
            || echo "::warning::auto-merge unavailable or check pending; PR left open for next run / manual merge"
          exit 0
