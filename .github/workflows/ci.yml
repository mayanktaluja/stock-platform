name: CI

# Runs on every push to main and every PR targeting main.
# Purpose: catch module-load regressions (missing exports, bad imports) before
# Vercel builds prod. PR #39 merged an `import { getExpandedUniverse }` that
# had no matching export — Node threw SyntaxError at cold-start and every
# /api/* route returned 500 until the next deploy. The smoke step below
# reproduces that exact check by `import()`ing every prod entry point.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-and-test:
    name: Smoke + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match Vercel's current Node default. Bump in lockstep with the
          # runtime pinned in vercel.json / Vercel project settings.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Module-load smoke test
        # Imports server.js and every prod module. Fails if any named import
        # can't resolve. Bounded to ~6s by the KV prime timeouts in server.js.
        run: npm run smoke

      - name: Unit tests
        run: npm test

  e2e-modal:
    name: E2E — stock modal renders
    # Guards the most-used interactive surface: renderSwsModalCore (shared by the
    # India/US/KR/TW stock-detail modals). A render-time ReferenceError — e.g. the
    # `hasV3` leftover that shipped broken in #437 and was hotfixed in #438 —
    # produces a silently-empty modal body that the smoke + unit gates CANNOT see
    # (smoke `import()`s server.js, not the browser classic-script app.js; unit
    # tests never touch app.js). These Playwright specs open the modal and assert
    # the body actually populated (.sws-modal-hero + ≥1 .sws-modal-section / rich
    # score-breakdown), so a modal-render regression fails the build, not prod.
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Modal-render e2e (India stock-detail)
        # Runs stock-detail-modal.spec — the hardened "silent renderer failure"
        # guard (asserts .sws-modal-hero + ≥1 .sws-modal-section) against the
        # committed India picks-latest.json. It exercises the SHARED
        # renderSwsModalCore, so a render-time throw (the hasV3 class) fails here
        # for EVERY region's modal. Scoped to this one spec on purpose: it needs
        # no fixture build and is deterministic in CI, whereas us-picks.spec's
        # /Rewards/ assertion depends on US deep-brief fixture content a fresh CI
        # build lacks. The Playwright config auto-starts node server.js on :4011,
        # auth off (reuseExistingServer:false under CI).
        run: npx playwright test stock-detail-modal

      - name: Per-user isolation e2e (auth iter 2)
        # Runs per-user-isolation.spec — the acceptance gate for per-user data
        # namespacing. Two browser contexts pinned to distinct subs via the
        # NODE_ENV=test-gated X-Test-Sub header prove that a 2nd signed-in user
        # sees neither the 1st user's watchlist nor portfolio. Deterministic
        # (no fixture build; seeds its own data via API), so it belongs in CI —
        # a regression here is a cross-user data leak, the worst-case outcome.
        run: npx playwright test per-user-isolation
