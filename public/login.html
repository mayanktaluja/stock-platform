<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarBhai · Sign in</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23E0B060' d='M12 2L14.6 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.4z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0B0C10;
      color: #EDEDED;
      font-family: "Geist", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #13151C;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 36px 32px 32px;
    }

    .star {
      width: 32px;
      height: 32px;
      margin: 0 auto 18px;
      display: block;
      color: #E0B060;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: -0.01em;
      text-align: center;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      color: rgba(237, 237, 237, 0.55);
      font-size: 13px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(237, 237, 237, 0.55);
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: #11131A;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 12px 14px;
      color: #EDEDED;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 120ms ease;
    }
    input[type="password"]:focus {
      border-color: rgba(224, 176, 96, 0.4);
    }

    button {
      width: 100%;
      margin-top: 16px;
      background: #E0B060;
      color: #13151C;
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 120ms ease, opacity 120ms ease;
    }
    button:hover:not(:disabled) { background: #C99853; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      margin-top: 14px;
      min-height: 18px;
      font-size: 13px;
      text-align: center;
    }
    .msg.error { color: #E57373; }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: rgba(237, 237, 237, 0.35);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2L14.6 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.4z"/>
    </svg>
    <h1>StarBhai</h1>
    <p class="sub">Indian Stock Intelligence</p>

    <form id="login-form" autocomplete="off">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        autofocus
        required
      >
      <button type="submit" id="submit-btn">Sign in</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>

    <p class="footer">Private terminal · authorized access only</p>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const input = document.getElementById("password");
    const btn = document.getElementById("submit-btn");
    const msg = document.getElementById("msg");

    function showError(text) {
      msg.textContent = text;
      msg.classList.add("error");
    }
    function clearMsg() {
      msg.textContent = "";
      msg.classList.remove("error");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: input.value }),
        });
        if (res.ok) {
          window.location.href = "/";
          return;
        }
        if (res.status === 429) {
          showError("Too many attempts. Try again in 15 minutes.");
        } else if (res.status === 401) {
          showError("Wrong password.");
          input.value = "";
          input.focus();
        } else if (res.status === 500) {
          showError("Login is not configured on this server.");
        } else {
          showError(`Sign in failed (${res.status}).`);
        }
      } catch (err) {
        showError("Network error. Check your connection and try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
