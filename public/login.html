  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0B0C10;
      color: #EDEDED;
      font-family: "Geist", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #13151C;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 36px 32px 32px;
    }

    .star {
      width: 32px;
      height: 32px;
      margin: 0 auto 18px;
      display: block;
      color: #E0B060;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: -0.01em;
      text-align: center;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      color: rgba(237, 237, 237, 0.55);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #FFFFFF;
      color: #13151C;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      transition: background 120ms ease, transform 120ms ease;
    }
    .google-btn:hover { background: #F2F2F2; }
    .google-btn:active { transform: translateY(1px); }
    .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: rgba(237, 237, 237, 0.35);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,6 61.2,37.5 94.6,37.5 67.7,57 78.6,89.7 50,70 21.4,89.7 32.3,57 5.4,37.5 38.8,37.5"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="50" y="64" text-anchor="middle" fill="currentColor"
        font-family="Fraunces, serif" font-size="34" font-weight="600" font-style="italic">S</text>
    </svg>
    <h1>Starbhai</h1>
    <p class="sub">Indian Stock Intelligence</p>

    <a class="google-btn" href="/api/auth/google">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

    <p class="footer">Private terminal · authorized access only</p>
