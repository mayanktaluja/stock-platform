<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbhai · Sign in</title>
  <meta name="robots" content="noindex,nofollow">

  <!-- PR #1: OG / Twitter / Apple metadata. Login page is noindex but link
       previews (Slack/Twitter/WhatsApp) still call og:* when someone shares
       the URL, so we want a branded preview rather than a generic blob. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Starbhai">
  <meta property="og:title" content="Starbhai Stock Platform">
  <meta property="og:description" content="Private terminal · authorized access only.">
  <meta property="og:url" content="https://starbhai-stock-platform.vercel.app/login.html">
  <meta property="og:image" content="https://starbhai-stock-platform.vercel.app/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Starbhai Stock Platform">
  <meta name="twitter:description" content="Private terminal · authorized access only.">
  <meta name="twitter:image" content="https://starbhai-stock-platform.vercel.app/og-image.jpg">
  <meta name="theme-color" content="#FBFAF7">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Starbhai">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,6 61.2,37.5 94.6,37.5 67.7,57 78.6,89.7 50,70 21.4,89.7 32.3,57 5.4,37.5 38.8,37.5' fill='none' stroke='%23E0B060' stroke-width='5' stroke-linejoin='round'/%3E%3Ctext x='50' y='68' text-anchor='middle' fill='%23E0B060' font-family='Georgia, serif' font-size='40' font-weight='600' font-style='italic'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Theme boot — mirrors gated/index.html:11-26 so the login page opens in
       the SAME theme the app will. Resolution: explicit stored choice >
       legacy 'theme' > light default (OS preference intentionally ignored).
       First-time visitors get light (consistent with the post-auth default);
       returning dark users get a dark login with no light→dark whiplash. Placed
       after the meta tags so the theme-color swap can find its element, and
       before <style> so data-theme resolves the cascade on the first paint
       (<html data-theme="light"> is the hardcoded default, so light never
       flashes). -->
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var stored = localStorage.getItem('starbhaiTheme');
        var legacy = localStorage.getItem('theme');
        var theme = stored === 'dark' ? 'dark' : (stored === 'light' ? 'light' : (legacy === 'dark' ? 'dark' : 'light'));
        root.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#0B0C10');
        }
      } catch (e) {
        root.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <style>
    /* Dual-palette login. Values mirror the app's design tokens
       (gated/index.html) so login and app share one brand:
         --lg-bg      ← --bg-primary   (#FBFAF7 light / #0B0C10 dark)
         --lg-card    ← --bg-card      (#FFFFFF light / #13151C dark)
         --lg-ink     ← --text-primary (#1A1C22 light / #EDEDED dark)
         --lg-accent  ← --gold         (#B07A1E light AA / #E0B060 dark)
       Light is the default; [data-theme="dark"] restores the original look. */
    :root {
      --lg-bg: #FBFAF7;
      --lg-card: #FFFFFF;
      --lg-card-border: rgba(20, 22, 28, 0.10);
      --lg-card-shadow: 0 1px 3px rgba(20, 22, 28, 0.06), 0 12px 34px rgba(20, 22, 28, 0.07);
      --lg-ink: #1A1C22;
      --lg-sub: rgba(26, 28, 34, 0.60);
      --lg-footer: rgba(26, 28, 34, 0.44);
      --lg-accent: #B07A1E;
      --lg-btn-bg: #FFFFFF;
      --lg-btn-ink: #1A1C22;
      --lg-btn-border: rgba(20, 22, 28, 0.18);
      --lg-btn-hover: #F6F4EE;
    }

    [data-theme="dark"] {
      --lg-bg: #0B0C10;
      --lg-card: #13151C;
      --lg-card-border: rgba(255, 255, 255, 0.06);
      --lg-card-shadow: none;
      --lg-ink: #EDEDED;
      --lg-sub: rgba(237, 237, 237, 0.55);
      --lg-footer: rgba(237, 237, 237, 0.35);
      --lg-accent: #E0B060;
      --lg-btn-bg: #FFFFFF;
      --lg-btn-ink: #13151C;
      --lg-btn-border: rgba(255, 255, 255, 0.06);
      --lg-btn-hover: #F2F2F2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--lg-bg);
      color: var(--lg-ink);
      font-family: "Geist", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--lg-card);
      border: 1px solid var(--lg-card-border);
      border-radius: 14px;
      box-shadow: var(--lg-card-shadow);
      padding: 36px 32px 32px;
    }

    .star {
      width: 32px;
      height: 32px;
      margin: 0 auto 18px;
      display: block;
      color: var(--lg-accent);
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: -0.01em;
      text-align: center;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      color: var(--lg-sub);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: var(--lg-btn-bg);
      color: var(--lg-btn-ink);
      border: 1px solid var(--lg-btn-border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      transition: background 120ms ease, transform 120ms ease, border-color 120ms ease;
    }
    .google-btn:hover { background: var(--lg-btn-hover); }
    .google-btn:active { transform: translateY(1px); }
    .google-btn:focus-visible {
      outline: 2px solid var(--lg-accent);
      outline-offset: 2px;
    }
    .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: var(--lg-footer);
      letter-spacing: 0.04em;
    }

    @media (prefers-reduced-motion: reduce) {
      .google-btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,6 61.2,37.5 94.6,37.5 67.7,57 78.6,89.7 50,70 21.4,89.7 32.3,57 5.4,37.5 38.8,37.5"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="50" y="64" text-anchor="middle" fill="currentColor"
        font-family="Fraunces, serif" font-size="34" font-weight="600" font-style="italic">S</text>
    </svg>
    <h1>Starbhai</h1>
    <p class="sub">Stock Platform</p>

    <a class="google-btn" href="/api/auth/google">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>Continue with Google</span>
    </a>

    <p class="footer">Private terminal · authorized access only</p>
  </main>
</body>
</html>
